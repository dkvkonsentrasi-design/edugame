<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petualangan Bahasa Indonesia</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#183153}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#dbeafe,#fef3c7);min-height:100vh;padding:20px}.app{max-width:760px;margin:auto;background:white;border-radius:24px;padding:26px;box-shadow:0 16px 45px #24477722}h1{margin:0;color:#1d4ed8}p{line-height:1.55}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#eff6ff;border-radius:30px;padding:9px 14px;font-weight:700}.bar{height:12px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:22px 0}.fill{height:100%;background:#22c55e;width:0;transition:.3s}.question{font-size:1.4rem;font-weight:750;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;border:0;border-radius:14px;padding:14px;cursor:pointer;font-weight:700}button:focus-visible{outline:3px solid #f59e0b}.option{background:#eff6ff;color:#1e3a8a;border:2px solid #bfdbfe;text-align:left}.option:hover:not(:disabled){background:#dbeafe}.option:disabled{cursor:default}.correct{background:#dcfce7!important;border-color:#22c55e!important}.wrong{background:#fee2e2!important;border-color:#ef4444!important}.primary{background:#2563eb;color:white}.secondary{background:#fef3c7;color:#92400e}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.feedback{min-height:55px;margin-top:16px;font-weight:700}.hidden{display:none}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:#e0e7ff;color:#312e81}.answer{min-height:60px;border:2px dashed #93c5fd;border-radius:14px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.answer button{background:#bfdbfe;padding:10px}.hint{color:#64748b;font-size:.95rem}select{padding:12px;border:2px solid #bfdbfe;border-radius:12px;font:inherit;width:100%;margin-top:10px}@media(max-width:520px){.options{grid-template-columns:1fr}.app{padding:18px}}</style></head><body><main class="app"><header><h1>📚 Petualangan Bahasa Indonesia</h1><p>Belajar sambil bermain: kuis, melengkapi kalimat, dan menyusun kata!</p></header><section id="start"><label for="level"><b>Pilih tingkat:</b></label><select id="level"><option value="dasar">Dasar (SD)</option><option value="lanjut">Lanjutan (SMP)</option></select><p>Setiap permainan berisi 10 soal acak. Jawaban benar bernilai 10 poin. Kamu punya 3 nyawa. ❤️❤️❤️</p><button class="primary" onclick="startGame()">▶ Mulai Bermain</button></section><section id="game" class="hidden"><div class="top"><span class="pill" id="counter"></span><span class="pill" id="score"></span><span class="pill" id="lives"></span></div><div class="bar"><div class="fill" id="progress"></div></div><div id="type" class="hint"></div><div class="question" id="question"></div><div id="options" class="options"></div><div id="builder" class="hidden"><div id="answer" class="answer"></div><div id="chips" class="chips"></div><p class="hint">Ketuk kata sesuai urutan untuk menyusun kalimat.</p><button class="secondary" onclick="clearBuild()">↩ Ulangi Susunan</button> <button class="primary" onclick="checkBuild()">✔ Periksa Jawaban</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden" onclick="nextQuestion()">Soal Berikutnya →</button><button class="secondary" onclick="restart()">Mulai Ulang</button></div></section><section id="finish" class="hidden"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="primary" onclick="restart()">🔄 Main Lagi</button></section></main><script>const bank={dasar:[{q:'Antonim kata “besar” adalah …',a:['Tinggi','Kecil','Panjang','Luas'],c:1},{q:'Sinonim kata “gembira” adalah …',a:['Sedih','Marah','Senang','Takut'],c:2},{q:'Kalimat yang menggunakan tanda tanya dengan tepat adalah …',a:['Siapa namamu?','Ayo belajar?','Wah, indah?','Tutup pintu?'],c:0},{q:'Kata baku yang tepat adalah …',a:['Apotik','Praktek','Apotek','Ijin'],c:2},{q:'Hewan yang disebut dalam kalimat “Kucing itu tidur di kursi” adalah …',a:['Kursi','Tidur','Kucing','Itu'],c:2},{q:'Lengkapi: Ibu memasak nasi di …',a:['kamar mandi','dapur','halaman','garasi'],c:1},{q:'Kata yang menunjukkan kegiatan adalah …',a:['Biru','Meja','Membaca','Indah'],c:2},{q:'Huruf kapital digunakan pada …',a:['awal nama orang','semua kata','akhir kalimat','semua kata kerja'],c:0},{q:'Susun menjadi kalimat yang benar.',words:['Budi','membaca','buku'],solution:'Budi membaca buku'},{q:'Susun menjadi kalimat yang benar.',words:['Adik','bermain','di','taman'],solution:'Adik bermain di taman'},{q:'Lawan kata “rajin” adalah …',a:['Tekun','Malas','Pandai','Cepat'],c:1},{q:'Kalimat perintah yang tepat adalah …',a:['Apa kabar?','Tolong tutup pintu!','Hari ini cerah.','Betapa indah!'],c:1}],lanjut:[{q:'Gagasan utama sebuah paragraf disebut …',a:['Ide pokok','Kalimat penjelas','Judul buku','Amanat'],c:0},{q:'Teks yang berisi langkah-langkah melakukan sesuatu disebut …',a:['Deskripsi','Narasi','Prosedur','Eksposisi'],c:2},{q:'Kalimat efektif yang tepat adalah …',a:['Para siswa-siswa belajar.','Siswa-siswa semua belajar.','Para siswa belajar.','Semua para siswa-siswa belajar.'],c:2},{q:'Kata baku yang benar adalah …',a:['Aktifitas','Aktivitas','Atlit','Resiko'],c:1},{q:'Majas yang membandingkan secara langsung disebut …',a:['Metafora','Hiperbola','Ironi','Personifikasi'],c:0},{q:'Tujuan teks persuasi adalah …',a:['Menghibur','Mengajak atau meyakinkan','Menceritakan masa lalu','Menjelaskan urutan waktu'],c:1},{q:'Bagian cerita yang berisi penyelesaian masalah disebut …',a:['Orientasi','Komplikasi','Resolusi','Abstrak'],c:2},{q:'Konjungsi sebab-akibat adalah …',a:['Dan','Tetapi','Karena','Atau'],c:2},{q:'Susun kalimat efektif berikut.',words:['Kami','belajar','Bahasa','Indonesia'],solution:'Kami belajar Bahasa Indonesia'},{q:'Susun kalimat berikut.',words:['Mereka','berdiskusi','di','perpustakaan'],solution:'Mereka berdiskusi di perpustakaan'},{q:'Teks laporan hasil observasi bersifat …',a:['Imajinatif','Objektif','Pribadi','Persuasif'],c:1},{q:'Pernyataan yang dapat dibuktikan kebenarannya disebut …',a:['Opini','Fakta','Saran','Dugaan'],c:1}]};let questions=[],idx=0,points=0,hearts=3,locked=false,chosen=[];const $=id=>document.getElementById(id);function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function show(id){['start','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function startGame(){questions=shuffle(bank[$('level').value]).slice(0,10);idx=0;points=0;hearts=3;show('game');render()}function restart(){show('start')}function render(){locked=false;chosen=[];const item=questions[idx];$('counter').textContent=`Soal ${idx+1}/${questions.length}`;$('score').textContent=`⭐ ${points} poin`;$('lives').textContent=`${'❤️'.repeat(hearts)}${'🖤'.repeat(3-hearts)}`;$('progress').style.width=`${idx/questions.length*100}%`;$('question').textContent=item.q;$('feedback').textContent='';$('next').classList.add('hidden');$('options').innerHTML='';$('builder').classList.toggle('hidden',!item.words);$('type').textContent=item.words?'🧩 Susun Kata':'🎯 Pilihan Ganda';if(item.words){$('chips').innerHTML='';$('answer').innerHTML='';shuffle(item.words.map((w,i)=>({w,i}))).forEach(({w,i})=>{const b=document.createElement('button');b.className='chip';b.textContent=w;b.dataset.i=i;b.onclick=()=>{if(locked)return;chosen.push({w,i});b.disabled=true;drawAnswer()};$('chips').append(b)})}else{item.a.forEach((v,i)=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>submit(i===item.c,i);$('options').append(b)})}}function drawAnswer(){$('answer').innerHTML='';chosen.forEach((obj,j)=>{const b=document.createElement('button');b.textContent=obj.w;b.onclick=()=>{if(locked)return;chosen.splice(j,1);[...$('chips').children].find(x=>Number(x.dataset.i)===obj.i).disabled=false;drawAnswer()};$('answer').append(b)})}function clearBuild(){if(locked)return;chosen=[];[...$('chips').children].forEach(x=>x.disabled=false);drawAnswer()}function checkBuild(){if(locked||!chosen.length)return;const item=questions[idx];submit(chosen.map(x=>x.w).join(' ')===item.solution)}function submit(ok,selected){if(locked)return;locked=true;const item=questions[idx];if(ok){points+=10;$('feedback').textContent='🎉 Benar! Hebat sekali!';$('feedback').style.color='#15803d'}else{hearts--;$('feedback').textContent='💡 Belum tepat. Jawaban: '+(item.words?item.solution:item.a[item.c]);$('feedback').style.color='#b91c1c'}[...$('options').children].forEach((b,i)=>{b.disabled=true;if(i===item.c)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('score').textContent=`⭐ ${points} poin`;$('lives').textContent=`${'❤️'.repeat(hearts)}${'🖤'.repeat(3-hearts)}`;$('next').textContent=hearts===0||idx===questions.length-1?'Lihat Hasil →':'Soal Berikutnya →';$('next').classList.remove('hidden')}function nextQuestion(){if(hearts===0||idx===questions.length-1){finish();return}idx++;render()}function finish(){$('progress').style.width='100%';show('finish');$('resultTitle').textContent=points>=80?'🏆 Luar Biasa!':points>=50?'🌟 Kerja Bagus!':'💪 Terus Berlatih!';$('resultText').textContent=`Skor akhir: ${points} poin. Kamu menjawab ${points/10} soal dengan benar dari ${idx+1} soal yang dimainkan. Ayo main lagi untuk meningkatkan kemampuan Bahasa Indonesiamu!`}</script></body></html>
